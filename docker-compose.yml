version: '3.8'

services:
  # 2. NestJS REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: CASPIRE_backend_api
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => {if (r.statusCode !== 200) process.exit(1);})"]
      interval: 15s
      timeout: 5s
      retries: 3

  # One-shot Prisma migration service (run before backend)
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    image: caspire_backend_migrate
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  # 3. Angular SSR Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: CASPIRE_frontend_web
    restart: always
    ports:
      - "4000:80"
    environment:
      NODE_ENV: production
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
