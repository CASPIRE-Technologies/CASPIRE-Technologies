version: '3.8'

services:
  # 1. MySQL 8 Database Service
  mysql:
    image: mysql:8.0
    container_name: apex_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apex_company_db
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. NestJS REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://apex_user:apex_password@mysql:3306/apex_company_db
      JWT_SECRET: apex-prod-secret-key-replace-in-env
      JWT_REFRESH_SECRET: apex-prod-refresh-secret-replace-in-env
      ADMIN_EMAIL: admin@apexsoftware.lk
      ADMIN_PASSWORD: AdminPass123!
      CORS_ORIGIN: "http://localhost:4000,http://localhost:4200"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => {if (r.statusCode !== 200) process.exit(1);})"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Angular SSR Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_frontend_web
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
